name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate project archive
        run: |
          base64 -d source/GO3_GPT_Bridge_Android_MVP_v0.3.zip.b64 > project.zip
          unzip -q project.zip
          ls -la GO3_GPT_Bridge

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: GO3_GPT_Bridge
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GO3-GPT-Bridge-debug-apk
          path: GO3_GPT_Bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
