name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, final-clean-v080 ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GO3-GPT-Bridge-v1.0.1-safe.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GO3-GPT-Bridge-v1.0.1-safe
          path: GO3-GPT-Bridge-v1.0.1-safe.apk
          if-no-files-found: error

      - name: Publish direct-download release
        if: github.ref == 'refs/heads/final-clean-v080'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-safe
          name: GO3 GPT Bridge v1.0.1 Safe
          make_latest: true
          files: GO3-GPT-Bridge-v1.0.1-safe.apk
